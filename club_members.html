    <title>Club Member List</title>
    <style>
        nav.navbar {
            background-color: #bf7d88;
            padding-left: 30px;

        }

        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-color: #f8f3f5;
            margin-left: 50;
            margin-right: 50;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1{
            color: #6b3f46;
            margin-bottom: 10px;
        }

        h3{
            color: #5f5555;
            font-size: 15px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        input[type="text"]{
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #c9a8a8;
            border-radius: 8px;
            font-size: 15px;
            font-family: Cambria, serif;
        }

        input[type="text"]:focus{
            outline: none;
            border-color: #8d6a6a;
        }

        input[type="button"]{
            background: #b97b7b;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-family: Cambria, serif;
        }
        
        .results {
            margin-top: 15px;
            height: 120px;
            margin-left: 150px;
            margin-right: 150px;
            overflow-y: auto;
            border-top: 1px solid #c9a8a8;
