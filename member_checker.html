    <style>
        nav.navbar {
            background-color: #bf7d88;
            padding-left: 30px;
            padding-right: 30px;
            width: 100%;
        }

        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-color: #f8f3f5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container{
            background: rgba(243, 217, 217, 0.6);
            padding: 30px;
            width: 430px;
            border: 2px solid #b99494;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1{
            color: #6b3f46;
            margin-bottom: 10px;
        }

        h2, h3, h4{
            color: #5f5555;
            font-size: 15px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        input[type="text"]{
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #c9a8a8;
            border-radius: 8px;
            font-size: 15px;
            font-family: Cambria, serif;
        }

        input[type="text"]:focus{
            outline: none;
            border-color: #8d6a6a;
        }

        input[type="button"]{
            background: #b97b7b;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-family: Cambria, serif;
        }
    </style>
    <title>Member Checker</title>
</head>

<nav class="navbar navbar-expand-sm">

            <input type="text" id="first_name" placeholder="enter your first name"><br><br>
